name: CI

on:
  push:
    branches: [ "main" ]
    tags: ['*']
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: haskell-actions/setup@v2

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpango1.0-dev libcairo2-dev libblas-dev liblapack-dev
        
    - name: Cache
      uses: actions/cache@v4
      env:
        cache-name: cache-stack
      with:
          path: ~/.stack
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/stack.yaml') }}-${{ hashFiles('**/stack.yaml.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

    - name: Install dependencies
      run: stack build --only-dependencies --test --bench --coverage

    - name: Build and Test
      run: |
        stack build --test --bench --coverage
        stack test --coverage

    - name: Generate coverage report
      uses: 8c6794b6/hpc-codecov-action@v4
      with:
        target: stack:all
        excludes: Main,Paths_qsfgames
        verbose: true

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true